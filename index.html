<!DOCTYPE html>
<html lang="en">
<head>
  <!-- These Lines are from the Photo Sphere Viewer Documentation 
  that allows you to impliment their opensource viewer in personal code-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>360 Viewer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.11.5/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.11.5/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin@5.11.5/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5.11.5/index.min.css">

  <style>
    html, body { margin: 0; height: 100%; }
    #viewer { width: 100%; height: 100%; }

    /* Floor arrow tilt
       PSV positions the button we tilt the SVG icon inside it.
       rotateX: 0deg = facing you, 90deg = completely flat.
       lower = more dramatic foreshortening, higher = more subtle. */
    .psv-virtual-tour-arrow svg {
      transform: perspective(300px) rotateX(65deg);
      transform-origin: center center;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .35)); /* delete this line for a flat "decal on the floor" look */
    }
    /* Hide the thumbnail picture in the arrow hover tooltip this doesn't affect the gallery */
    .psv-virtual-tour-tooltip {
      background-image: none !important;
      min-height: 0 !important;
      height: auto !important;
    }
    .psv-virtual-tour-tooltip img {
      display: none !important;
    }
    /* Hide the download button in the bottom toolbar because it's unprofessional */
    .psv-download-button {
      display: none !important;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.11.5/index.module.min.js",
      "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.11.5/index.module.min.js",
      "@photo-sphere-viewer/gallery-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin@5.11.5/index.module.min.js",
      "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5.11.5/index.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewer"></div>

  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';
    import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';
    import { GalleryPlugin } from '@photo-sphere-viewer/gallery-plugin';
    import { VirtualTourPlugin } from '@photo-sphere-viewer/virtual-tour-plugin';

    // Layout is Classroom <-> Hall1 <-> Hall2 <-> Conference
    // "thumbnail" is what shows in the bottom gallery bar. It reuses the panorama
    // image so you don't need extra files

    //If need be we can adjust yaw and pitch to place arrows perfectly
    const nodes = [
      {
        id: 'classroom',
        name: 'Classroom',
        panorama: 'images/Classroom.jpg',
        thumbnail: 'images/Classroom.jpg',
        links: [
          { nodeId: 'hall1', position: { yaw: '-156deg', pitch: '-18deg' } },
        ],
      },
      {
        id: 'hall1',
        name: 'Hall 1',
        panorama: 'images/Hall1.jpg',
        thumbnail: 'images/Hall1.jpg',
        links: [
          { nodeId: 'classroom', position: { yaw: '180deg', pitch: '-30deg' } },
          { nodeId: 'hall2', position: { yaw: '-92deg', pitch: '-15deg' } },
        ],
      },
      {
        id: 'hall2',
        name: 'Hall 2',
        panorama: 'images/Hall2.jpg',
        thumbnail: 'images/Hall2.jpg',
        links: [
          { nodeId: 'hall1', position: { yaw: '-175deg', pitch: '-20deg' } },
          { nodeId: 'conference', position: { yaw: '30deg', pitch: '-25deg' } },
        ],
      },
      {
        id: 'conference',
        name: 'Conference',
        panorama: 'images/Conference.jpg',
        thumbnail: 'images/Conference.jpg',
        links: [
          { nodeId: 'hall2', position: { yaw: '120deg', pitch: '-20deg' } },
        ],
      },
    ];

    // Zoom settings found in PSV documentation - changed these to adjust how zoomed in the photos start.
    // Starting Zoom - 0 = fully zoomed out, 100 = fully zoomed in. (fixes issue where we were fully zoomed in)
    // Max Field of View - widest allowed view in degrees (90 is the default, higher = wider).
    const START_ZOOM = 20;
    const MAX_FOV = 90;

    const viewer = new Viewer({
      container: document.querySelector('#viewer'),
      defaultZoomLvl: START_ZOOM,
      maxFov: MAX_FOV,
      plugins: [
        MarkersPlugin,
        // Gallery bar at the bottom: click a room to jump straight to it.
        // Found that the gallery must be listed before the virtual tour plugin.
        // visibleOnLoad: true = bar is open at start (false = hidden until the toolbar button is clicked)
        // This was clouding the UI with all the images and looked nasty
        // hideOnClick: true = bar closes after you pick a room
        [GalleryPlugin, {
          visibleOnLoad: false,
          hideOnClick: false,
          thumbnailSize: { width: 160, height: 100 },
        }],
        [VirtualTourPlugin, {
          positionMode: 'manual',
          renderMode: '2d',
          startNodeId: 'classroom',
          nodes,
        }],
      ],
    });

    // Apply the starting zoom on first load and every time you move to a new photo
    const tour = viewer.getPlugin(VirtualTourPlugin);
    viewer.addEventListener('ready', () => viewer.zoom(START_ZOOM), { once: true });
    tour.addEventListener('node-changed', () => viewer.zoom(START_ZOOM));
  </script>
</body>
</html>
